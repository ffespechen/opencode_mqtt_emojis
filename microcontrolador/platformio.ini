; ============================================================
;  Emojis MQTT - Microcontrolador
;  ESP32 + Arduino + pantalla redonda GC9A01 + LEDs RGB
; ============================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Librerías:
;  - TFT_eSPI      : controlador de la pantalla GC9A01
;  - PubSubClient  : cliente MQTT
;  - ArduinoJson   : parseo del mensaje JSON publicado por la app web
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.1.0

; ------------------------------------------------------------------
;  Configuración de la pantalla (TFT_eSPI) mediante flags -D.
;  Estas banderas se aplican TANTO al sketch como a la librería, por
;  lo que el driver GC9A01 se compila correctamente en ambos lados.
; ------------------------------------------------------------------
;  Driver GC9A01 (pantalla redonda 240x240) y desactivar el setup
;  por defecto de la librería:
;    -D USER_SETUP_LOADED=1
;    -D GC9A01_DRIVER
;  Pines SPI (basados en el setup oficial "Setup46_GC9A01_ESP32.h"):
;    TFT_MISO  -> GPIO 19
;    TFT_MOSI  -> GPIO 23
;    TFT_SCLK  -> GPIO 18
;    TFT_CS    -> GPIO 15
;    TFT_DC    -> GPIO 2
;    TFT_RST   -> GPIO 4
; ------------------------------------------------------------------
build_flags =
    -D USER_SETUP_LOADED=1
    -D GC9A01_DRIVER
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=4
    -D LOAD_GLCD
    -D LOAD_FONT2
    -D LOAD_FONT4
    -D LOAD_FONT6
    -D LOAD_FONT7
    -D LOAD_FONT8
    -D LOAD_GFXFF
    -D SMOOTH_FONT
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
